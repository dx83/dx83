  <rect x="1" y="1" width="878" height="258" rx="16" fill="#0d1117" stroke="#30363d" />
  <path d="M17 1h846a16 16 0 0 1 16 16v31H1V17A16 16 0 0 1 17 1Z" fill="#161b22" />
  <path d="M1 48h878" stroke="#30363d" />
  <circle cx="28" cy="25" r="5" fill="#f85149" />
  <circle cx="48" cy="25" r="5" fill="#d29922" />
  <circle cx="68" cy="25" r="5" fill="#3fb950" />
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">
    <text x="440" y="30" text-anchor="middle" fill="#8b949e" font-size="14">dx83 — ~/workspace</text>
    <text x="36" y="94" font-size="20">
      <tspan fill="#3fb950">~ $</tspan><tspan fill="#c9d1d9"> whoami</tspan>
